name: CI / CD & Deployment Pipeline

on:
  push:
    branches: [main, devops-implementation]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: business-inc
  REGISTRY: ghcr.io
  IMAGE_FULL: ghcr.io/${{ github.repository_owner }}/business-inc

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. Lint, Test & Quality Checks
  # ─────────────────────────────────────────────────────────────
  test-and-lint:
    name: Lint, Test & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install root & server dependencies
        run: |
          npm ci
          npm --prefix server ci

      - name: Run Automated Test Suite
        run: npm test

      - name: Check for high vulnerabilities
        run: npm --prefix server audit --audit-level=high
        continue-on-error: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Validate Terraform Configuration
        run: |
          cd terraform
          terraform fmt -check || terraform fmt
          terraform init -backend=false
          terraform validate

  # ─────────────────────────────────────────────────────────────
  # 2. Build & Scan Docker Image
  # ─────────────────────────────────────────────────────────────
  docker:
    name: Build, Scan & Push Image
    runs-on: ubuntu-latest
    needs: test-and-lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_FULL }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=true

      - name: Build Docker Image Locally for Scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:scan

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.IMAGE_NAME }}:scan'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────
  # 3. Trigger Render Deploy (Cloud Staging/Demo)
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Render deploy hook
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            curl -fsSL -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
              -H "Content-Type: application/json" \
              --retry 3 --retry-delay 5
          else
            echo "RENDER_DEPLOY_HOOK_URL not configured, skipping cloud webhook trigger."
          fi

      - name: Health Verification
        run: |
          echo "Render deployment trigger step completed."
